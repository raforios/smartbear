name: Python microservices checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"] # La versión del proyecto (CLAUDE.md §2)
        # Lista de los directorios de microservicios para que el workflow los recorra
        service-directory:
          - "services/auth"
          - "services/events"
          - "services/files"
          - "services/ml_functions"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies for ${{ matrix.service-directory }}
      working-directory: ${{ matrix.service-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest # Instalamos las herramientas de calidad
        pip install -r requirements.txt # Instalamos las dependencias específicas del servicio

    - name: Run Pylint on ${{ matrix.service-directory }}
      working-directory: ${{ matrix.service-directory }}
      run: |
        # La regla del proyecto es 10.00 (CLAUDE.md §11). Sin --rcfile: el
        # .pylintrc de la raíz está en .gitignore y sólo silencia lxml, que
        # ninguno de estos cuatro servicios usa.
        pylint --fail-under=10.0 .

    - name: Test with Pytest for ${{ matrix.service-directory }}
      working-directory: ${{ matrix.service-directory }}
      run: |
        pytest
