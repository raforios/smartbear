<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login">
    <main class="login-card">
        <h1>CMS — Panel de Administración</h1>
        <p class="login-hint">Inicia sesión con una cuenta del microservicio AUTH.</p>
        <form id="login-form">
            <label>
                <span>Email</span>
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>
                <span>Contraseña</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" id="login-submit">Entrar</button>
            <p id="login-error" class="form-error" hidden></p>
        </form>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
