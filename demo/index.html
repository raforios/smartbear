<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministerio de Minería y Metalurgia | Bolivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <div id="navbar-container"></div>

    <header id="inicio" class="hero">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-content">
            <h1 class="hero-title">Atrayendo Inversión y Tecnología</h1>
            <p>Integrando a Bolivia en el mercado global de minerales con seguridad jurídica y competitividad.</p>
            <div class="hero-divider"></div>
        </div>
    </header>

    <main class="container">
        <section id="comunicacion" class="section container">
            <h2 class="section-title">Centro de Comunicación</h2>
            <div class="prensa-grid" id="cms-noticias"></div>
        </section>

        <section class="slider-section">
            <div class="slider-container" id="cms-slider"></div>
        </section>

        <section id="normativas" class="section">
            <h2 class="section-title">Reglamentaciones y Documentos</h2>
            <div id="docs-container" class="grid-docs"></div>
        </section>

        <section id="entidades" class="section">
            <h2 class="section-title">Entidades Bajo Tuición</h2>
            <div class="grid-entidades" id="cms-entidades"></div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="js/app.js"></script>
    
</body>
</html>
