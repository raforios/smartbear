<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercados Internacionales | Minería Bolivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <header class="hero" style="height: 35vh; min-height: 250px;">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-content">
            <h1 class="hero-title" style="font-size: 2.2rem;">Mercados Globales</h1>
            <p>Cotizaciones en tiempo real - London Metal Exchange (LME)</p>
            <div class="hero-divider"></div>
        </div>
    </header>

    <main class="container section">
        <h2 class="section-title">Variación Semanal de Cotizaciones</h2>
        <div style="background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: var(--shadow); border-top: 4px solid var(--oro); max-width: 900px; margin: 0 auto;">
            <canvas id="lme-chart" width="400" height="200"></canvas>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/script.js"></script>
</body>
</html>
