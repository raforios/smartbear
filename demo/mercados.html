<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercados Internacionales | Minería Bolivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <header class="hero">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-content">
            <h1 class="hero-title">Mercados Globales</h1>
            <p>Cotizaciones oficiales quincenales — London Metal Exchange (LME)</p>
            <div class="hero-divider"></div>
        </div>
    </header>

    <main class="container section">
        <div class="mercados-overview">
            <section id="mercados-resumen" class="mercados-resumen">
                <h2 class="section-title">Última Quincena Oficial</h2>
                <div class="mercados-kpis" id="mercados-kpis">
                    <div class="mercados-kpi-loading">Cargando…</div>
                </div>
                <p class="mercados-period-label" id="mercados-period-label"></p>
            </section>

            <section class="mercados-controls">
                <div class="mercados-control">
                    <label for="year-filter">Año</label>
                    <select id="year-filter"></select>
                </div>
                <div class="mercados-control">
                    <label for="unit-filter">Unidad de cotización</label>
                    <select id="unit-filter"></select>
                </div>
                <div class="mercados-control">
                    <label>Minerales en el gráfico</label>
                    <div id="mineral-filter" class="mineral-filter"></div>
                </div>
                <div class="mercados-control">
                    <label for="period-picker">Quincena para reporte oficial</label>
                    <select id="period-picker"></select>
                    <div class="mercados-downloads">
                        <a id="dl-png" class="btn-download" target="_blank" rel="noopener">
                            <i class="fa-solid fa-image"></i> PNG
                        </a>
                        <a id="dl-pdf" class="btn-download" target="_blank" rel="noopener">
                            <i class="fa-solid fa-file-pdf"></i> PDF
                        </a>
                    </div>
                </div>
            </section>
        </div>

        <section class="mercados-chart-card">
            <h3>Serie histórica — promedio quincenal en <code id="chart-unit-label">USD / —</code></h3>
            <canvas id="lme-chart"></canvas>
        </section>

        <section class="mercados-table-card">
            <h3>Histórico quincenal completo</h3>
            <div class="mercados-table-wrap">
                <table id="mercados-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="js/script.js"></script>
    <script type="module" src="js/ticker_bootstrap.js"></script>
    <script type="module" src="js/mercados.js"></script>
</body>
</html>
