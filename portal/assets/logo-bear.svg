<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="SmartDecisions">
  <defs>
    <linearGradient id="bearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ad6c2"/>
      <stop offset="100%" stop-color="#2bb39a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#5ad6c2"/>
    </linearGradient>
  </defs>
  <!-- Reinterpreted bear: a calm, decisive face holding an upward chart -->
  <!-- Ears -->
  <circle cx="58" cy="58" r="18" fill="url(#bearGrad)"/>
  <circle cx="142" cy="58" r="18" fill="url(#bearGrad)"/>
  <circle cx="58" cy="58" r="8" fill="#0b1020"/>
  <circle cx="142" cy="58" r="8" fill="#0b1020"/>
  <!-- Head -->
  <circle cx="100" cy="108" r="62" fill="url(#bearGrad)"/>
  <!-- Snout -->
  <ellipse cx="100" cy="130" rx="32" ry="24" fill="#0b1020" opacity="0.18"/>
  <!-- Eyes (decisive, focused) -->
  <circle cx="80" cy="100" r="6" fill="#0b1020"/>
  <circle cx="120" cy="100" r="6" fill="#0b1020"/>
  <circle cx="82" cy="98" r="2" fill="#e6edf3"/>
  <circle cx="122" cy="98" r="2" fill="#e6edf3"/>
  <!-- Nose -->
  <ellipse cx="100" cy="124" rx="7" ry="5" fill="#0b1020"/>
  <!-- Calm mouth -->
  <path d="M88 140 Q100 148 112 140" stroke="#0b1020" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Upward chart line in front (the "decision" the bear holds) -->
  <polyline points="40,170 70,150 95,160 130,130 165,115"
            fill="none"
            stroke="url(#chartGrad)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
  <circle cx="165" cy="115" r="6" fill="#7aa2ff"/>
</svg>
