<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILLING — Facturación</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/billing.css">
    <link rel="icon" type="image/png" sizes="64x64" href="../demo/assets/favicon-bear-64.png">
    <script type="module" src="js/app.js"></script>
</head>
<body>

<div class="app-shell">

    <aside class="app-side">
        <div class="app-brand">
            <img src="../demo/assets/bear-face.jpg" alt="" aria-hidden="true">
            <div>
                <h1>BILLING</h1>
                <small id="shopName">Facturación</small>
            </div>
        </div>

        <nav class="app-nav" id="nav">
            <button class="nav-item" data-section="counter">
                <span class="icon" aria-hidden="true">🧾</span><span>Mostrador</span>
            </button>
            <button class="nav-item" data-section="sales">
                <span class="icon" aria-hidden="true">📄</span><span>Ventas</span>
            </button>
            <button class="nav-item" data-section="catalog">
                <span class="icon" aria-hidden="true">💊</span><span>Catálogo</span>
            </button>
            <button class="nav-item" data-section="purchases" data-roles="ADMIN,MANAGER">
                <span class="icon" aria-hidden="true">📦</span><span>Recepción</span>
            </button>
            <button class="nav-item" data-section="dashboard">
                <span class="icon" aria-hidden="true">📊</span><span>Tablero</span>
            </button>
            <button class="nav-item" data-section="settings" data-roles="ADMIN,MANAGER">
                <span class="icon" aria-hidden="true">⚙️</span><span>Configuración</span>
            </button>
        </nav>

        <div class="app-side-foot">
            <p class="muted small" id="userChip">…</p>
            <button class="btn btn-ghost btn-small btn-block" id="logout">Salir</button>
        </div>
    </aside>

    <main class="app-main" id="view">
        <p class="muted">Cargando…</p>
    </main>

</div>

<div id="toast-host" aria-live="polite"></div>

</body>
</html>
