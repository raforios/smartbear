<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILLING — Iniciar sesión</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/billing.css">
    <link rel="icon" type="image/png" sizes="64x64" href="../demo/assets/favicon-bear-64.png">
    <script type="module" src="js/login.js"></script>
</head>
<body class="login-page">

<main class="login-box">
    <div class="app-brand">
        <img src="../demo/assets/bear-face.jpg" alt="" aria-hidden="true">
        <div>
            <h1>BILLING</h1>
            <small>Facturación de BearSoft</small>
        </div>
    </div>

    <form id="login-form" class="card">
        <h2>Inicia sesión</h2>
        <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
            <span>Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" hidden></p>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="muted small">Una iniciativa de <strong>BearSoft</strong></p>
</main>

</body>
</html>
