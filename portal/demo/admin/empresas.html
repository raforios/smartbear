<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas — SmartDecisions</title>
    <link rel="stylesheet" href="../styles/demo.css?v=4e84f1ab15">
    <link rel="stylesheet" href="../styles/shell.css?v=9c2d5f8ca5">
    <link rel="stylesheet" href="../styles/panels.css?v=5bd96858ce">
    <link rel="stylesheet" href="../styles/analyses.css?v=afa137006c">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="../js/config.js?v=4a13bfbaea"></script>
    <script src="../js/auth.js?v=e0c72ecc39" defer></script>
    <script src="../js/icons.js?v=652a070f95" defer></script>
    <script src="../js/shell.js?v=dae73a9ac4" defer></script>
    <script src="../js/api.js?v=7206932d80" defer></script>
    <script src="../js/ui.js?v=406a08249f" defer></script>
    <script src="../js/session.js?v=91bb432af9" defer></script>
    <script src="empresas.js?v=ccb9b36c43" defer></script>
</head>
<body>

<main>
    <div class="container">
        <h1 class="page-title">Empresas</h1>
        <p class="page-subtitle">Las empresas clientes de la plataforma. Cada usuario pertenece a una; su nombre no cambia, porque todos los servicios guardan los datos de la empresa con ese nombre.</p>

        <section class="card">
            <div class="field-row">
                <label>Buscar
                    <input type="search" id="companiesSearch" placeholder="Nombre o NIT"></label>
                <button type="button" class="btn btn-primary btn-small" id="companyNew"
                        data-btn-icon="plus" disabled>Nueva empresa</button>
            </div>

            <form class="form-stack" id="companyForm" hidden autocomplete="off">
                <h4 id="companyFormTitle"></h4>
                <label id="companyNameField"><span>Nombre (razón social; no se puede cambiar después)</span>
                    <input type="text" id="companyName" minlength="3" maxlength="50"></label>
                <label><span>NIT (sólo números)</span>
                    <input type="text" id="companyTaxId" maxlength="20" inputmode="numeric" pattern="[0-9]*"></label>
                <label id="companyActiveField"><span>Estado</span>
                    <select id="companyActive">
                        <option value="true">Activa</option>
                        <option value="false">Inactiva (no se ofrece para usuarios nuevos)</option>
                    </select></label>
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel btn-small" id="companyCancel"
                            data-btn-icon="close">Cancelar</button>
                    <button type="button" class="btn btn-save btn-small" id="companySave"
                            data-btn-icon="check">Guardar</button>
                </div>
            </form>

            <div class="table-wrapper">
                <table class="data-table" id="companiesTable">
                    <thead><tr>
                        <th>Empresa</th><th>NIT</th><th class="numeric">Usuarios</th><th>Estado</th><th></th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="legend-hint" id="companiesCount"></p>
            <p class="form-note" id="companiesNote" aria-live="polite"></p>
        </section>
    </div>
</main>

</body>
</html>
