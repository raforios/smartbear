<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salud de la plataforma — SmartDecisions</title>
    <link rel="stylesheet" href="../styles/demo.css?v=4e84f1ab15">
    <link rel="stylesheet" href="../styles/shell.css?v=9c2d5f8ca5">
    <link rel="stylesheet" href="../styles/panels.css?v=780a805f2f">
    <link rel="stylesheet" href="../styles/analyses.css?v=afa137006c">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="../js/config.js?v=4a13bfbaea"></script>
    <script src="../js/auth.js?v=e0c72ecc39" defer></script>
    <script src="../js/icons.js?v=652a070f95" defer></script>
    <script src="../js/shell.js?v=06a844ee12" defer></script>
    <script src="../js/api.js?v=7206932d80" defer></script>
    <script src="../js/ui.js?v=406a08249f" defer></script>
    <script src="../js/session.js?v=91bb432af9" defer></script>
    <script src="../js/platform_health.js?v=bd18547afb" defer></script>
    <script src="salud.js?v=48e62fe9d8" defer></script>
</head>
<body>

<main>
    <div class="container">
        <h1 class="page-title">Salud de la plataforma</h1>
        <p class="page-subtitle">Si cada servicio responde, cuánto tarda y en qué estado están sus tablas.</p>

        <section class="card">
            <div class="field-row">
                <button type="button" class="btn btn-ghost btn-small" id="healthRefresh"
                        data-btn-icon="refresh">Actualizar</button>
                <span class="legend-hint" id="healthSummary"></span>
            </div>
            <div class="table-wrapper">
                <table class="data-table" id="servicesTable">
                    <thead><tr>
                        <th>Servicio</th><th>Estado</th><th class="numeric">Respuesta</th><th>Tablas</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h3>Tablas</h3>
            <p class="legend-hint">Las cantidades son las de DynamoDB, que las actualiza cada seis horas.</p>
            <div class="table-wrapper">
                <table class="data-table" id="tablesTable">
                    <thead><tr>
                        <th>Servicio</th><th>Tabla</th><th>Estado</th>
                        <th class="numeric">Registros</th><th class="numeric">Tamaño</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="form-note" id="healthNote" aria-live="polite"></p>
        </section>
    </div>
</main>

</body>
</html>
