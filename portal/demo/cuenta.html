<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta — SmartDecisions</title>
    <link rel="stylesheet" href="styles/demo.css?v=b1274f62bf">
    <link rel="stylesheet" href="styles/shell.css?v=ebea324912">
    <link rel="stylesheet" href="styles/panels.css?v=ad406aec48">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="js/config.js?v=936de2e74b"></script>
    <script src="js/auth.js?v=c153b5ce24" defer></script>
    <script src="js/icons.js?v=7d327bd034" defer></script>
    <script src="js/shell.js?v=53a2beaced" defer></script>
    <script src="js/api.js?v=21b59b7fe7" defer></script>
    <script src="js/ui.js?v=412b9cdd72" defer></script>
    <script src="js/session.js?v=91bb432af9" defer></script>
    <script src="js/account.js?v=98256de5be" defer></script>
</head>
<body>

<main>
    <div class="container">
        <div class="sd-page-head">
            <div>
                <h1>Mi cuenta</h1>
                <p>Tus datos y tu contraseña.</p>
            </div>
        </div>

        <section class="sd-grid sd-grid-half">
            <article class="sd-panel">
                <div class="sd-panel-head"><h2>Tus datos</h2></div>
                <div class="sd-list" id="accountData"></div>
            </article>

            <article class="sd-panel">
                <div class="sd-panel-head"><h2>Cambiar contraseña</h2></div>
                <form class="form-stack" id="passwordForm" novalidate>
                    <label><span>Contraseña actual</span>
                        <span class="sd-reveal"><input type="password" id="passwordCurrent" autocomplete="current-password" required>
                        <button type="button" class="sd-reveal-toggle" data-reveal></button></span></label>
                    <label><span>Contraseña nueva (8 caracteres o más)</span>
                        <span class="sd-reveal"><input type="password" id="passwordNew" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="sd-reveal-toggle" data-reveal></button></span></label>
                    <label><span>Repite la contraseña nueva</span>
                        <span class="sd-reveal"><input type="password" id="passwordRepeat" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="sd-reveal-toggle" data-reveal></button></span></label>
                    <button type="submit" class="btn btn-primary" id="passwordSave">Cambiar contraseña</button>
                    <p class="form-note" id="passwordNote" aria-live="polite"></p>
                </form>
            </article>
        </section>
    </div>
</main>

<footer class="demo-footer"></footer>

</body>
</html>
