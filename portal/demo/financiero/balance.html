<body>

<main>
    <div class="container">
        <div class="sd-page-head"><div><h1>Balance General</h1>
            <p>Lo que tienes, lo que debes y lo que es tuyo, al cierre del período.</p></div></div>

        <section class="card">
            <div class="period-bar">
                <label class="field">
                    <span>Período</span>
                    <select id="periodSelect"></select>
                </label>
                <p class="chart-hint" id="ratesLine"></p>
            </div>
            <ul class="notice-list" id="notices"></ul>
        </section>

        <section class="card">
            <div class="table-wrapper">
                <table class="data-table statement-table" id="balanceTable">
                    <thead><tr><th>Saldo</th><th class="numeric">Bs</th><th class="numeric">USD</th><th class="numeric">USDT</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <div class="metric-grid" id="indicators"></div>
    </div>
