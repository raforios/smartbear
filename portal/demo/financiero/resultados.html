    <title>Estado de Resultados — SmartDecisions</title>
</head>
<body>

<main>
    <div class="container">
        <div class="sd-page-head"><div><h1>Estado de Resultados</h1>
            <p>Lo que entró y lo que salió en el período, con el IVA y el IT descontados de las ventas cada mes.</p></div></div>

        <section class="card">
            <div class="period-bar">
                <label class="field">
                    <span>Período</span>
                    <select id="periodSelect"></select>
                </label>
                <p class="chart-hint" id="ratesLine"></p>
                <span class="ai-slot" id="financeAi"></span>
            </div>
            <ul class="notice-list" id="notices"></ul>
        </section>

        <section class="card">
            <div class="table-wrapper">
                <table class="data-table statement-table" id="statementTable">
                    <thead><tr><th>Línea</th><th class="numeric">Bs</th><th class="numeric">USD</th><th class="numeric">USDT</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="chart-hint">El IUE se paga sobre el año: su estimación aparece sólo al elegir un año.</p>
        </section>
    </div>
</main>

</body>
