<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal — SmartDecisions</title>
    <link rel="stylesheet" href="styles/demo.css?v=4e84f1ab15">
    <link rel="stylesheet" href="styles/shell.css?v=9c2d5f8ca5">
    <link rel="stylesheet" href="styles/panels.css?v=5bd96858ce">
    <link rel="stylesheet" href="styles/analyses.css?v=afa137006c">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="js/config.js?v=4a13bfbaea"></script>
    <script src="js/auth.js?v=e0c72ecc39" defer></script>
    <script src="js/icons.js?v=652a070f95" defer></script>
    <script src="js/shell.js?v=2f2dd76554" defer></script>
    <script src="js/api.js?v=d166c15dbf" defer></script>
    <script src="js/ui.js?v=406a08249f" defer></script>
    <script src="js/session.js?v=91bb432af9" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="js/platform_events.js?v=091f764f43" defer></script>
    <script src="js/platform_health.js?v=f274f5f90c" defer></script>
    <script src="js/home.js?v=b27b7e9e1a" defer></script>
</head>
<body>

<main>
    <div class="container">
        <div class="sd-page-head">
            <div>
                <h1 id="homeHello">Bienvenido</h1>
                <p id="homeLast">SmartDecisions, de BearSoft.</p>
            </div>
            <p class="sd-today" id="homeToday"></p>
        </div>

        <section class="sd-grid" id="homeTop">
            <a class="sd-hero" href="admin/tipo-cambio.html" id="homeRates">
                <p class="sd-hero-label">Cotizaciones del día</p>
                <span class="sd-skeleton is-big"></span><span class="sd-skeleton"></span>
            </a>
            <!-- The ADMIN's second half: whether the platform is up (Rafael, 21-oct). -->
            <a class="sd-stat" href="admin/salud.html" id="homeHealth" hidden>
                <p class="sd-stat-label">Salud de la plataforma</p>
                <p class="sd-stat-value" id="homeHealthValue">Revisando…</p>
                <div class="sd-health-grid" id="homeHealthGrid"></div>
                <p class="sd-stat-other" id="homeHealthTables"></p>
                <p class="sd-stat-note" id="homeHealthNote"></p>
            </a>
            <!-- Everyone else's second half: their own latest changes, each one
                 opening its screen (Rafael, 21-oct). -->
            <div class="sd-stat" id="homeMine" hidden>
                <p class="sd-stat-label">Lo último que hiciste</p>
                <div id="homeMineList"></div>
                <p class="sd-stat-note" id="homeMineNote">Leyendo…</p>
            </div>
        </section>

        <!-- The ADMIN's last hours: answered and failed calls (Rafael, 21-oct). -->
        <section class="sd-panel" id="homeEvents" hidden>
            <div class="sd-panel-head">
                <h2>Actividad de las últimas 12 horas</h2>
                <span class="sd-panel-note" id="homeEventsNote">Leyendo…</span>
                <a class="btn btn-ghost btn-small" href="admin/eventos.html" data-btn-icon="clock">Ver el detalle</a>
            </div>
            <div class="sd-grid sd-grid-wide">
                <div class="sd-chart"><canvas id="homeEventsChart"></canvas></div>
                <div id="homeEventsErrors"></div>
            </div>
        </section>

        <!-- Who uses the account and when they last came in: the manager sees
             their company; the ADMIN, every registered user. -->
        <section class="sd-panel" id="homeUsers" hidden>
            <div class="sd-panel-head">
                <h2 id="homeUsersTitle">Usuarios de tu empresa</h2>
                <span class="sd-panel-note" id="homeUsersNote"></span>
                <a class="btn btn-primary btn-small" id="homeUsersManage" href="admin/usuarios.html"
                   data-btn-icon="user" hidden>Administrar usuarios</a>
            </div>
            <div class="table-wrapper">
                <table class="data-table" id="homeUsersTable">
                    <thead><tr>
                        <th id="homeUsersCompany" hidden>Empresa</th>
                        <th>Nombre</th><th>Correo</th><th>Rol</th><th>Última sesión</th>
                        <th class="numeric">Sesiones</th><th>Estado</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<footer class="demo-footer"></footer>

</body>
</html>
