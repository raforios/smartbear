<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SmartDecisions</title>
    <link rel="stylesheet" href="/styles/demo.css?v=b1274f62bf">
    <link rel="stylesheet" href="/styles/login.css?v=932c545eaf">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="/js/config.js?v=4a13bfbaea"></script>
    <script src="/js/auth.js?v=e0c72ecc39" defer></script>
    <script src="/js/ui.js?v=412b9cdd72" defer></script>
    <script src="/js/icons.js?v=7d327bd034" defer></script>
</head>
<body class="sd-login">

<div class="login-shell">
    <section class="login-brand" aria-hidden="true">
        <div class="login-mark">
            <img src="/assets/bear-face.jpg?v=e028b9fcd7" alt="">
            <span>Smart<b>Decisions</b></span>
        </div>
        <div class="login-message">
            <h2 id="brandTitle">Tu negocio, tus decisiones.</h2>
            <p id="brandLine">Con los ingresos, egresos y gastos que ya tienes, en pocos pasos ves
               cómo está tu negocio y qué conviene hacer.</p>
        </div>
        <div class="login-maker">
            <span>Un producto de</span>
            <img src="/assets/bearsoft-logo-white.png?v=8732c0528b" alt="BearSoft">
        </div>
    </section>

    <section class="login-form-side">
        <form id="loginForm" class="login-form" novalidate>
            <h1>Inicia sesión</h1>
            <p class="login-lead">Entra con el correo y la contraseña de tu cuenta.</p>
            <label class="login-field">
                <span>Correo</span>
                <span class="login-input">
                    <input type="email" name="email" required autocomplete="email" autofocus>
                </span>
            </label>
            <label class="login-field">
                <span>Contraseña</span>
                <span class="login-input has-toggle sd-reveal">
                    <input type="password" name="password" id="loginPassword" required
                           autocomplete="current-password">
                    <button type="button" class="sd-reveal-toggle" id="passwordToggle"
                            aria-label="Mostrar la contraseña" aria-pressed="false"></button>
                </span>
            </label>
            <!-- Only the e-mail is kept, never the password nor the session. -->
            <label class="login-remember">
                <input type="checkbox" id="rememberEmail"><span>Recordar mi correo</span>
            </label>
            <button type="submit" class="btn btn-primary login-submit" id="loginButton">Entrar</button>
            <p class="form-note" id="loginNote" aria-live="polite"></p>
        </form>
    </section>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const { qs, toast, setButtonBusy } = window.SD_UI;
        const form = qs('#loginForm');
        const note = qs('#loginNote');
        const button = qs('#loginButton');

        /**
         * Where to go after a successful login.
         *
         * This page is also what the distribution serves for any 404, with the
         * requested URL left intact. So it can be running at /playground/ while
         * being the login: a relative 'home.html' would resolve to
         * /playground/home.html, which 404s back to this same page — the loop
         * that made the tab impossible to close.
         *
         * Absolute paths only, and `next` is accepted only when it is a path of
         * this site: an absolute URL there is an open redirect.
         */
        function destination() {
            const next = new URLSearchParams(location.search).get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                return next;
            }
            // A seller has one screen: their day on the street.
            if (window.SD_AUTH.getRole() === 'SELLER') {
                return window.SD_CONFIG.SELLER_HOME;
            }
            return '/home.html';
        }

        // The brand message changes from one visit to the next (Rafael, 14-oct:
        // A and B, without marrying one line). The first one is in the markup.
        const MESSAGES = [
            ['Tu negocio, tus decisiones.',
             'Con los ingresos, egresos y gastos que ya tienes, en pocos pasos ves cómo está tu negocio y qué conviene hacer.'],
            ['Tu negocio en la palma de tu mano.',
             'Pocos datos, los que cualquier gerente tiene, y decisiones acertadas en pocos pasos.']
        ];
        const [title, line] = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
        qs('#brandTitle').textContent = title;
        qs('#brandLine').textContent = line;

        // The password can be read before sending it.
        window.SD_UI.revealToggle(qs('#loginPassword'), qs('#passwordToggle'));

        // "Recordar mi correo": the e-mail only, in this browser. The session
        // itself still lives in the tab and lasts what AUTH says.
        const REMEMBER_KEY = 'sd_login_email';
        const remember = qs('#rememberEmail');
        const store = (value) => {
            try {
                if (value) localStorage.setItem(REMEMBER_KEY, value);
                else localStorage.removeItem(REMEMBER_KEY);
            } catch (error) { /* storage blocked: nothing is remembered */ }
        };
        let remembered = '';
        try { remembered = localStorage.getItem(REMEMBER_KEY) || ''; } catch (error) { /* same */ }
        if (remembered) {
            form.elements.email.value = remembered;
            remember.checked = true;
            qs('#loginPassword').focus();
        }

        // If already authenticated, jump straight to the home (or ?next=...).
        if (window.SD_AUTH.isAuthenticated()) {
            location.replace(destination());
            return;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            note.className = 'form-note';
            note.textContent = '';

            const data = new FormData(form);
            const email = (data.get('email') || '').toString().trim();
            const password = (data.get('password') || '').toString();

            if (!email || !password) {
                note.classList.add('error');
                note.textContent = 'Completa tu correo y tu contraseña.';
                return;
            }

            const done = setButtonBusy(button, 'Entrando…');
            try {
                await window.SD_AUTH.login(email, password);
                store(remember.checked ? email : '');
                toast('Bienvenido a SmartDecisions Demo.', 'success');
                location.replace(destination());
            } catch (error) {
                note.classList.add('error');
                note.textContent = error.message || 'No se pudo iniciar sesión.';
            } finally {
                done();
            }
        });
    });
</script>

</body>
</html>
