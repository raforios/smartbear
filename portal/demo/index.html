<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SmartDecisions</title>
    <link rel="stylesheet" href="/styles/demo.css?v=68d58f731b">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=5">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=5">
    <script src="/js/config.js?v=cea826bc9c"></script>
    <script src="/js/auth.js?v=ee49f43985" defer></script>
    <script src="/js/ui.js?v=b84ea2ad2a" defer></script>
</head>
<body>

<header class="demo-header">
    <div class="container demo-nav">
        <a href="https://bearsoft.com.bo" class="brand">
            <img src="/assets/bear-face.jpg" alt="" aria-hidden="true">
            <span class="brand-text">Smart<span class="accent">Decisions</span></span>
        </a>
        <div class="demo-nav-actions"></div>
    </div>
</header>

<main>
    <div class="container">
        <h1 class="page-title" style="text-align: center;">Inicia sesión</h1>
        <p class="page-subtitle" style="text-align: center; margin-left: auto; margin-right: auto;">Analítica comercial y de cotizaciones.</p>

        <form id="loginForm" class="form-card form-stack" novalidate>
            <label>
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email" autofocus>
            </label>
            <label>
                <span>Contraseña</span>
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary" id="loginButton">Entrar</button>
            <p class="form-note" id="loginNote" aria-live="polite"></p>
        </form>
    </div>
</main>

<footer class="demo-footer">
    <div class="container">
        Una iniciativa de <strong>BearSoft</strong> · SmartDecisions
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const { qs, toast, setButtonBusy } = window.SD_UI;
        const form = qs('#loginForm');
        const note = qs('#loginNote');
        const button = qs('#loginButton');

        /**
         * Where to go after a successful login.
         *
         * This page is also what the distribution serves for any 404, with the
         * requested URL left intact. So it can be running at /playground/ while
         * being the login: a relative 'home.html' would resolve to
         * /playground/home.html, which 404s back to this same page — the loop
         * that made the tab impossible to close.
         *
         * Absolute paths only, and `next` is accepted only when it is a path of
         * this site: an absolute URL there is an open redirect.
         */
        function destination() {
            const next = new URLSearchParams(location.search).get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                return next;
            }
            return '/home.html';
        }

        // If already authenticated, jump straight to the home (or ?next=...).
        if (window.SD_AUTH.isAuthenticated()) {
            location.replace(destination());
            return;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            note.className = 'form-note';
            note.textContent = '';

            const data = new FormData(form);
            const email = (data.get('email') || '').toString().trim();
            const password = (data.get('password') || '').toString();

            if (!email || !password) {
                note.classList.add('error');
                note.textContent = 'Completa email y contraseña.';
                return;
            }

            const done = setButtonBusy(button, 'Entrando…');
            try {
                await window.SD_AUTH.login(email, password);
                toast('Bienvenido a SmartDecisions Demo.', 'success');
                location.replace(destination());
            } catch (error) {
                note.classList.add('error');
                note.textContent = error.message || 'No se pudo iniciar sesión.';
            } finally {
                done();
            }
        });
    });
</script>

</body>
</html>
