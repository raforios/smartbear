<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — SmartDecisions</title>
    <link rel="stylesheet" href="/styles/demo.css?v=b4b5fb27fa">
    <link rel="stylesheet" href="/styles/login.css?v=76c656c1af">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-bear-64.png?v=8459d009ad">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-bear-32.png?v=940fb57b06">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=a7edc08fd8">
    <script src="/js/config.js?v=0b4736ed6f"></script>
    <script src="/js/auth.js?v=c153b5ce24" defer></script>
    <script src="/js/ui.js?v=bd318da6b9" defer></script>
    <script src="/js/icons.js?v=1b71096105" defer></script>
</head>
<body class="sd-login">

<div class="login-shell">
    <section class="login-brand" aria-hidden="true">
        <div class="login-mark">
            <img src="/assets/bear-face.jpg?v=e028b9fcd7" alt="">
            <span>Smart<b>Decisions</b></span>
        </div>
        <div class="login-message">
            <h2>Las cifras de tu empresa, claras para decidir.</h2>
            <p>Ventas, cobranza, inventario y compras en bolivianos, dólares y USDT, con el tipo de
               cambio de cada día.</p>
        </div>
        <div class="login-maker">
            <span>Un producto de</span>
            <img src="/assets/bearsoft-logo-white.png?v=8732c0528b" alt="BearSoft">
        </div>
    </section>

    <section class="login-form-side">
        <form id="loginForm" class="login-form" novalidate>
            <h1>Inicia sesión</h1>
            <p class="login-lead">Entra con el correo y la contraseña de tu cuenta.</p>
            <label class="login-field">
                <span>Correo</span>
                <span class="login-input">
                    <input type="email" name="email" required autocomplete="email" autofocus>
                </span>
            </label>
            <label class="login-field">
                <span>Contraseña</span>
                <span class="login-input has-toggle">
                    <input type="password" name="password" id="loginPassword" required
                           autocomplete="current-password">
                    <button type="button" class="login-toggle" id="passwordToggle"
                            aria-label="Mostrar la contraseña" aria-pressed="false"></button>
                </span>
            </label>
            <button type="submit" class="btn btn-primary login-submit" id="loginButton">Entrar</button>
            <p class="form-note" id="loginNote" aria-live="polite"></p>
        </form>
    </section>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const { qs, toast, setButtonBusy } = window.SD_UI;
        const form = qs('#loginForm');
        const note = qs('#loginNote');
        const button = qs('#loginButton');

        /**
         * Where to go after a successful login.
         *
         * This page is also what the distribution serves for any 404, with the
         * requested URL left intact. So it can be running at /playground/ while
         * being the login: a relative 'home.html' would resolve to
         * /playground/home.html, which 404s back to this same page — the loop
         * that made the tab impossible to close.
         *
         * Absolute paths only, and `next` is accepted only when it is a path of
         * this site: an absolute URL there is an open redirect.
         */
        function destination() {
            const next = new URLSearchParams(location.search).get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                return next;
            }
            // A seller has one screen: their day on the street.
            if (window.SD_AUTH.getRole() === 'SELLER') {
                return window.SD_CONFIG.SELLER_HOME;
            }
            return '/home.html';
        }

        // The password can be read before sending it; the button says which way it goes.
        const password = qs('#loginPassword');
        const toggle = qs('#passwordToggle');
        const paintToggle = () => {
            const shown = password.type === 'text';
            toggle.innerHTML = window.SD_ICONS.svg(shown ? 'eyeOff' : 'eye');
            toggle.setAttribute('aria-pressed', String(shown));
            toggle.setAttribute('aria-label', shown ? 'Ocultar la contraseña' : 'Mostrar la contraseña');
        };
        toggle.addEventListener('click', () => {
            password.type = password.type === 'password' ? 'text' : 'password';
            paintToggle();
        });
        paintToggle();

        // If already authenticated, jump straight to the home (or ?next=...).
        if (window.SD_AUTH.isAuthenticated()) {
            location.replace(destination());
            return;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            note.className = 'form-note';
            note.textContent = '';

            const data = new FormData(form);
            const email = (data.get('email') || '').toString().trim();
            const password = (data.get('password') || '').toString();

            if (!email || !password) {
                note.classList.add('error');
                note.textContent = 'Completa tu correo y tu contraseña.';
                return;
            }

            const done = setButtonBusy(button, 'Entrando…');
            try {
                await window.SD_AUTH.login(email, password);
                toast('Bienvenido a SmartDecisions Demo.', 'success');
                location.replace(destination());
            } catch (error) {
                note.classList.add('error');
                note.textContent = error.message || 'No se pudo iniciar sesión.';
            } finally {
                done();
            }
        });
    });
</script>

</body>
</html>
