<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BearSoft · SmartDecisions — De tu Excel de ventas a decisiones que mueven plata.">
    <title id="site-title"></title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css?v=1">
</head>
<body>

<header class="site-header">
    <div class="container nav">
        <a href="#hero" class="brand">
            <img src="assets/bear-face.jpg" alt="BearSoft" class="brand-mark">
            <span class="brand-text">Bear<span class="accent">Soft</span></span>
        </a>
        <nav class="nav-links">
            <a href="#about">Sobre Mí</a>
            <a href="#expertise">Expertise</a>
            <a href="#ml-app">SmartDecisions</a>
            <a href="#services">Servicios</a>
            <a href="#contact">Contacto</a>
            <a href="https://smartdecisions.bearsoft.com.bo" target="_blank" rel="noopener" class="btn btn-primary btn-small">Probar demo</a>
        </nav>
    </div>
</header>

<main>

    <section id="hero" class="hero">
        <div id="particles-js"></div>
        <div class="container hero-grid">
            <div class="hero-text">
                <p class="eyebrow">Por <strong>BearSoft</strong></p>
                <h1 id="hero-tagline"></h1>
                <p class="brand-name" id="hero-brand-name"></p>
                <h2 id="hero-subtitle"></h2>
                <a href="#services" class="btn btn-primary" id="hero-cta"></a>
            </div>
            <div class="hero-visual">
                <div class="bear-card">
                    <img src="assets/bear-mascot.jpg" alt="Mascota BearSoft" class="bear-icon">
                    <p class="bear-tagline">Decisiones <strong>firmes</strong> con datos reales.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="section">
        <div class="container about-grid">
            <div class="about-image">
                <img id="about-carousel-image" src="./img/about.png" alt="About">
            </div>
            <div class="about-content">
                <h2 id="about-title"></h2>
                <p id="about-intro"></p>
                <ul id="about-points" class="icon-list"></ul>
                <a href="./docs/cv.pdf" id="cv-button" class="btn btn-ghost" download>
                    <i class="fas fa-download"></i> <span id="cv-button-text"></span>
                </a>
            </div>
        </div>
    </section>

    <section id="expertise" class="section section-alt">
        <div class="container">
            <h2 id="expertise-title"></h2>
            <div class="card-grid" id="expertise-grid"></div>
        </div>
    </section>

    <section id="ml-app" class="section">
        <div class="container ml-app-grid">
            <div class="ml-app-content">
                <p class="eyebrow">Producto BearSoft</p>
                <h2 id="ml-app-title"></h2>
                <p id="ml-app-intro"></p>
                <ul id="ml-app-features" class="icon-list"></ul>
                <a href="" target="_blank" rel="noopener" class="btn btn-primary" id="ml-app-cta"></a>
            </div>
            <div class="ml-app-image">
                <img id="ml-carousel-image" src="./img/ml.png" alt="SmartDecisions">
            </div>
        </div>
    </section>

    <section id="smartdecisions" class="section section-alt">
        <div class="container">
            <h2 id="smartdecisions-title"></h2>
            <p class="section-lead" id="smartdecisions-intro"></p>
            <div class="formula" id="smartdecisions-formula"></div>
            <p class="section-note" id="smartdecisions-formula-note"></p>

            <h3 class="subhead" id="smartdecisions-benefits-title"></h3>
            <div class="card-grid" id="smartdecisions-benefits"></div>

            <h3 class="subhead" id="smartdecisions-steps-title"></h3>
            <ol class="steps" id="smartdecisions-steps"></ol>

            <h3 class="subhead" id="smartdecisions-pillars-title"></h3>
            <div class="card-grid" id="smartdecisions-pillars"></div>

            <div class="smartdecisions-cta">
                <a href="" target="_blank" rel="noopener" class="btn btn-primary" id="smartdecisions-cta-btn"></a>
            </div>
        </div>
    </section>

    <section id="services" class="section">
        <div class="container">
            <h2 id="services-title"></h2>
            <ul class="services-list" id="services-list"></ul>
        </div>
    </section>

    <section id="contact" class="section section-alt">
        <div class="container contact-grid">
            <div>
                <h2 id="contact-main-title"></h2>
                <p id="contact-intro"></p>
                <div class="social-links">
                    <a href="" target="_blank" rel="noopener" title="LinkedIn" id="linkedin-link"><i class="fab fa-linkedin"></i></a>
                    <a href="" target="_blank" rel="noopener" title="GitHub" id="github-link"><i class="fab fa-github"></i></a>
                    <a href="" target="_blank" rel="noopener" class="whatsapp-icon" title="Escríbeme por WhatsApp" id="whatsapp-link"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            <form class="contact-form" action="https://formspree.io/f/xblyoppy" method="POST">
                <input type="hidden" name="_subject" value="Nuevo Mensaje de Contacto desde la Web">
                <label>
                    <span>Nombre</span>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </label>
                <label>
                    <span>Email</span>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </label>
                <label>
                    <span>Mensaje</span>
                    <textarea id="message" name="message" rows="4" autocomplete="off" required></textarea>
                </label>
                <button type="submit" class="btn btn-primary" id="form-submit-button"></button>
            </form>
        </div>
    </section>

</main>

<footer class="site-footer">
    <div class="container footer-grid">
        <div>
            <span class="brand-text">Bear<span class="accent">Soft</span></span>
            <p class="muted">SmartDecisions — decisiones comerciales con datos.</p>
        </div>
        <p class="muted" id="copyright-year"></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
